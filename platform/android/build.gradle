plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.nerio.audioengine'
    // Pin the installed NDK explicitly; AGP's per-version default won't match.
    ndkVersion '29.0.14206865'
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'proguard-rules.pro'
        // 64-bit ABIs only: arm64-v8a is every modern Android phone/tablet,
        // x86_64 is the emulator. Google Play has required 64-bit since 2019.
        // Dropping the legacy 32-bit ABIs (armeabi-v7a/x86) also sidesteps
        // libFLAC's 32-bit-Android fseeko/ftello cross-compile quirk entirely.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    aaptOptions {
        noCompress 'bin'
    }
}

dependencies {
    /* none -- pure Android SDK */
}
