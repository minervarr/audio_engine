plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.nerio.audioengine'
    // Pin the installed NDK explicitly; AGP's per-version default won't match.
    ndkVersion '29.0.14206865'
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'proguard-rules.pro'
        // arm64-v8a is every modern Android phone/tablet, x86_64 is the
        // emulator, armeabi-v7a keeps 32-bit devices alive. The 32-bit bionic
        // quirks in the vendored decoders (libFLAC's HAVE_FSEEKO probe,
        // mpg123's SIZEOF_OFF_T) are handled in CMake — see the root
        // CMakeLists.txt; x86 stays out: no device, no emulator need.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    aaptOptions {
        noCompress 'bin'
    }
}

dependencies {
    /* none -- pure Android SDK */
}
